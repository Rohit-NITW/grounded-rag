name: Test and evaluate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      RAG_PROVIDER: demo
      RAG_DATA_DIR: ./data-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m grounded.evaluate --generate --output reports/ci-evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-${{ matrix.python-version }}
          path: reports/ci-evaluation.json
  browser:
    runs-on: ubuntu-latest
    env:
      RAG_PROVIDER: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/ui_smoke.py
